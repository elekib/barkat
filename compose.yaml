# Run Barkat from the published image:
#   cp .env.example .env
#   docker compose up -d
# To build from source instead, add the build overlay (see compose.build.yaml).
services:
  barkat:
    image: ghcr.io/elekib/barkat:${BARKAT_TAG:-latest}
    container_name: barkat
    env_file:
      - .env
    environment:
      PORT: 3000
      # The server runs as this user and owns everything in ./data.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "${BARKAT_PORT:-3040}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
